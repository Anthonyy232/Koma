[workspace]
members = ["data", "windows", "tools/peek"]
exclude = ["vendor"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-only"

# Exact builds against its own patched copies of these crates.
[patch.crates-io]
accesskit_windows = { path = "vendor/exact/vendor/accesskit-windows" }
taffy = { path = "vendor/exact/vendor/taffy" }
parley = { path = "vendor/exact/vendor/parley" }
fontique = { path = "vendor/exact/vendor/fontique" }
wgpu-hal = { path = "vendor/exact/vendor/wgpu-hal" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
